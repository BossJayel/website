<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jayel Studios</title>
    <!-- Favicon selaimen välilehdelle -->
    <link rel="icon" type="image/png" href="logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle, #232946 0%, #121629 100%);
            font-family: 'Montserrat', sans-serif;
            color: #fffffe;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            width: 100%;
        }

        /* Logon tyylit ja leijuva animaatio */
        .logo-wrapper {
            margin-bottom: 1.5rem;
            transition: transform 0.3s ease;
        }

        .logo-wrapper:hover {
            transform: scale(1.04) rotate(-1deg);
        }

        .logo-img {
            width: 220px;
            height: 220px;
            max-width: 60vw;
            max-height: 60vw;
            object-fit: cover;
            border-radius: 50%;
            /* Pehmeä hehku logon taustalle */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5),
                        0 0 50px rgba(184, 193, 236, 0.25);
            border: 3px solid rgba(184, 193, 236, 0.2);
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            color: #fffffe;
            text-transform: uppercase;
            letter-spacing: 0.35rem;
            margin: 0 0 0.5rem 0;
            cursor: default;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5), 
                         0 0 40px rgba(184, 193, 236, 0.3);
            transition: color 0.3s ease;
        }

        h1:hover {
            color: #b8c1ec;
        }

        .tagline {
            color: #b8c1ec;
            font-size: 0.95rem;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            margin-bottom: 2rem;
            opacity: 0.85;
        }

        /* Painikkeen tyylit */
        .play-link {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.85rem 1.8rem;
            border: 1.5px solid rgba(184, 193, 236, 0.4);
            border-radius: 999px;
            color: #fffffe;
            background: rgba(184, 193, 236, 0.05);
            backdrop-filter: blur(8px);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.12rem;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .play-link:hover {
            background: rgba(184, 193, 236, 0.2);
            border-color: #b8c1ec;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(184, 193, 236, 0.25);
        }

        .play-link svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            fill: #b8c1ec;
            transition: fill 0.3s ease;
        }

        .play-link:hover svg {
            fill: #ffffff;
        }

        @media (max-width: 600px) {
            .logo-img {
                width: 170px;
                height: 170px;
            }

            h1 {
                font-size: 1.8rem;
                letter-spacing: 0.2rem;
            }

            .tagline {
                font-size: 0.8rem;
                letter-spacing: 0.15rem;
            }

            .play-link {
                font-size: 0.8rem;
                padding: 0.75rem 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <div class="logo-wrapper">
            <img src="logo.png" alt="Jayel Studios Logo" class="logo-img">
        </div>

        <!-- Yrityksen nimi -->
        <h1>Jayel Studios</h1>
        <div class="tagline">Mobile Games & Apps</div>

        <!-- Google Play linkki -->
        <a class="play-link" href="https://play.google.com/store/apps/developer?id=Jayel+Studios" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                <path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.4c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/>
            </svg>
            Get apps on Google Play
        </a>
    </div>

</body>
</html>
